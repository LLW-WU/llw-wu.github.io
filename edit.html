<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>内容编辑 | LIU Lingwen</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="content.js"></script>
  <script defer src="editor.js"></script>
</head>
<body class="editor-body">
  <header class="editor-head"><div class="container">
    <h1 class="editor-brand">个人主页 · 内容编辑</h1>
    <a href="index.html" target="_blank" rel="noopener noreferrer">查看网站 ↗</a>
  </div></header>
  <main class="container editor-shell">
    <p class="editor-intro">这里只负责写文字。先选栏目，再修改字段；项目可以新增或删除。完成后点击底部的<strong>“下载 content.js”</strong>，用下载的文件替换网站仓库里同名文件。</p>
    <div class="editor-note">这是离线/静态编辑器，不需要账号。修改<strong>不会自动发布到网站</strong>；你下载文件并提交 GitHub 后才会更新。编辑中的草稿会尽可能保存在此浏览器。</div>
    <nav class="editor-switcher" aria-label="选择内容" id="editor-switcher">
      <button type="button" data-edit-tab="profile">个人简介</button>
      <button type="button" data-edit-tab="research">技术研究</button>
      <button type="button" data-edit-tab="data">数据科学</button>
      <button type="button" data-edit-tab="business">商业设计</button>
      <button type="button" data-edit-tab="publications">论文列表</button>
    </nav>
    <div class="edit-form" id="edit-form"></div>
    <div class="editor-actions">
      <span class="editor-status" id="editor-status">已加载网站内容。</span>
      <div class="editor-actions-right">
        <button type="button" class="btn" id="reset-button">放弃草稿并恢复文件内容</button>
        <button type="button" class="btn btn-primary" id="download-button">下载 content.js</button>
      </div>
    </div>
  </main>
</body>
</html>
