<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>内容编辑 | 刘令文</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20261023-details-v12">
  <script defer src="content.js?v=20261024-education-v18"></script>
  <script defer src="site-core.js?v=20261023-details-v12"></script>
  <script defer src="preview-template.js?v=20261024-labels-v16"></script>
  <script defer src="editor.js?v=20261024-labels-v16"></script>
</head>
<body class="editor-body">
<header class="editor-head"><div class="container">
  <h1 class="editor-brand">个人主页 · 内容编辑</h1>
  <a href="index.html" target="_blank" rel="noopener noreferrer">查看文件版主页 ↗</a>
</div></header>
<main class="container editor-shell">
  <p class="editor-intro">选择栏目，直接修改正文。中文、英文分别填写；空白内容不会被自动补写。</p>
  <div class="editor-toolbar">
    <div class="editor-locale" role="group" aria-label="选择要编辑的语言">
      <span>正文语言</span>
      <button type="button" data-content-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-content-lang="en" aria-pressed="false">English</button>
    </div>
    <button type="button" class="btn" id="import-button">导入 content.js</button>
    <input type="file" id="import-file" accept=".js,.json,application/json,text/javascript" hidden>
  </div>
  <nav class="editor-switcher" aria-label="选择内容" id="editor-switcher">
    <button type="button" data-edit-tab="profile">个人信息</button>
    <button type="button" data-edit-tab="research">学术科研</button>
    <button type="button" data-edit-tab="data">数据科学</button>
    <button type="button" data-edit-tab="business">商业设计</button>
    <button type="button" data-edit-tab="publications">论文列表</button>
  </nav>
  <div class="edit-form" id="edit-form"></div>
  <div class="editor-actions">
    <span class="editor-status" id="editor-status" role="status">已加载 content.js。</span>
    <div class="editor-actions-right">
      <button type="button" class="btn" id="preview-button">预览草稿</button>
      <button type="button" class="btn btn-primary" id="download-button">下载 content.js</button>
    </div>
  </div>
  <p class="publish-note">下载后替换网站中的同名文件，再提交更新。这里只保存浏览器草稿，不会自动发布。</p>
  <details class="editor-extra"><summary>备份与恢复</summary><div class="extra-tools">
    <button type="button" class="btn" id="reset-button">放弃草稿，重新读取文件</button>
    <button type="button" class="btn" id="notes-button">下载写作笔记</button>
  </div></details>
  <noscript>编辑器需要 JavaScript。请在浏览器中启用后重新打开。</noscript>
</main>
<dialog id="preview-dialog" aria-labelledby="preview-title">
  <div class="preview-bar"><h2 id="preview-title">草稿预览 · 尚未发布</h2><button type="button" class="btn" id="close-preview">关闭预览</button></div>
  <iframe id="preview-frame" title="当前编辑内容的主页预览"></iframe>
</dialog>
</body>
</html>
