<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>内容编辑 | LIU Lingwen</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="content.js"></script>
  <script defer src="editor.js"></script>
</head>
<body class="editor-body">
  <header class="editor-head"><div class="container">
    <h1 class="editor-brand">个人主页 · 内容编辑</h1>
    <a href="index.html" target="_blank" rel="noopener noreferrer">查看主页 ↗</a>
  </div></header>
  <main class="container editor-shell">
    <p class="editor-intro">先选栏目，再选择要编辑的语言。<strong>中文和英文分开填写</strong>；修改项目标题、简介、流程等文字不需要碰 HTML。</p>
    <div class="editor-note">编辑内容会尽可能保存在当前浏览器作为草稿，但不会自动发布。写完后下载 <strong>content.js</strong>，替换 GitHub 仓库中的同名文件并提交。</div>
    <div class="editor-toolbar">
      <div class="editor-locale" role="group" aria-label="选择要编辑的语言">
        <span>正在编辑：</span>
        <button type="button" data-content-lang="zh" aria-pressed="true">中文</button>
        <button type="button" data-content-lang="en" aria-pressed="false">English</button>
      </div>
      <button type="button" class="btn" id="import-button">导入以前的 content.js</button>
      <input type="file" id="import-file" accept=".js,.json,application/json,text/javascript" hidden>
    </div>
    <nav class="editor-switcher" aria-label="选择内容" id="editor-switcher">
      <button type="button" data-edit-tab="profile">个人简介</button>
      <button type="button" data-edit-tab="research">技术研究</button>
      <button type="button" data-edit-tab="data">数据科学</button>
      <button type="button" data-edit-tab="business">商业设计</button>
      <button type="button" data-edit-tab="publications">论文列表</button>
    </nav>
    <div class="edit-form" id="edit-form"></div>
    <div class="editor-actions">
      <span class="editor-status" id="editor-status" role="status">已加载网页内容。</span>
      <div class="editor-actions-right">
        <button type="button" class="btn" id="reset-button">放弃草稿</button>
        <button type="button" class="btn btn-primary" id="download-button">下载 content.js</button>
      </div>
    </div>
  </main>
</body>
</html>
