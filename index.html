<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LIU Lingwen 的个人主页：技术研究、数据科学和商业设计。">
  <meta name="theme-color" content="#ffffff">
  <title>LIU Lingwen | 个人主页</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="content.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main">跳转到正文</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-name" href="#home">LIU Lingwen</a>
      <div class="language-switch" role="group" aria-label="语言 / Language">
        <button type="button" data-lang="zh" aria-pressed="true">中文</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="container" id="main">
    <section class="intro" id="home" aria-label="关于我">
      <div class="portrait" id="portrait" aria-hidden="true"><span>LL</span></div>
      <div class="intro-copy">
        <h1 id="profile-name">LIU Lingwen</h1>
        <p class="affiliation" id="profile-affiliation"></p>
        <p class="bio" id="profile-bio"></p>
        <p class="profile-links" id="profile-links"></p>
      </div>
    </section>

    <section class="focus" aria-labelledby="focus-heading">
      <h2 class="section-heading" id="focus-heading">我的方向</h2>
      <div class="tabs" role="tablist" aria-label="选择专业方向" id="focus-tabs">
        <a id="tab-research" class="tab" href="#research" role="tab" aria-controls="panel-research" aria-selected="true">技术研究</a>
        <a id="tab-data" class="tab" href="#data" role="tab" aria-controls="panel-data" aria-selected="false">数据科学</a>
        <a id="tab-business" class="tab" href="#business" role="tab" aria-controls="panel-business" aria-selected="false">商业设计</a>
      </div>
      <div class="tab-panels" id="tab-panels" aria-live="polite">
        <p class="loading-note">正在载入内容…</p>
      </div>
    </section>
  </main>

  <footer class="container footer">
    <span id="footer-text">LIU Lingwen · 个人主页</span>
    <span id="footer-email"></span>
  </footer>
</body>
</html>
